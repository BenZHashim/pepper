name: Build & Push Docker Images

on:
  push:
    branches: [master]
  workflow_dispatch:   # allows manual trigger from GitHub UI

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # needed to push to GHCR

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # automatic, no setup needed

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # GHCR requires lowercase — BenZHashim → benzHashim → benzHashim... → all lower
      - name: Lowercase owner
        id: owner
        run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      # ── MCP image ────────────────────────────────────────────────────────
      - name: Build and push MCP image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.mcp
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.name }}/sms-ai-mcp:latest
          cache-from: type=gha          # GitHub Actions cache — speeds up repeat builds
          cache-to: type=gha,mode=max

      # ── API image ─────────────────────────────────────────────────────────
      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.name }}/sms-ai-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
