name: Build & Push Docker Images

on:
  push:
    branches: [master]
  workflow_dispatch:   # allows manual trigger from GitHub UI

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # needed to push to GHCR

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # GHCR requires lowercase — BenZHashim → benzhashim
      - name: Lowercase owner
        id: owner
        run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      # ── Embed image ──────────────────────────────────────────────────────
      # Cache stored in GHCR — no 7-day expiry, always available
      - name: Build and push Embed image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.embed
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.name }}/sms-ai-embed:latest
          cache-from: type=registry,ref=ghcr.io/${{ steps.owner.outputs.name }}/sms-ai-embed:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ steps.owner.outputs.name }}/sms-ai-embed:buildcache,mode=max

      # ── MCP image ────────────────────────────────────────────────────────
      - name: Build and push MCP image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.mcp
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.name }}/sms-ai-mcp:latest
          cache-from: type=registry,ref=ghcr.io/${{ steps.owner.outputs.name }}/sms-ai-mcp:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ steps.owner.outputs.name }}/sms-ai-mcp:buildcache,mode=max

      # ── API image ─────────────────────────────────────────────────────────
      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.name }}/sms-ai-api:latest
          cache-from: type=registry,ref=ghcr.io/${{ steps.owner.outputs.name }}/sms-ai-api:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ steps.owner.outputs.name }}/sms-ai-api:buildcache,mode=max

      # ── Trigger Dokploy deploy (runs after all images are pushed) ─────────
      - name: Trigger Dokploy deployment
        run: curl -s -X GET "${{ secrets.DOKPLOY_WEBHOOK_URL }}"
